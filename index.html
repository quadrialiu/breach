<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>breach (private beta)</title>
<style>
:root{--bg:#070a07;--fg:#bff7bf;--dim:#6b8f6b;--ac:#4cff88;--bad:#ff6b5e;--card:#101a10;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,Menlo,Consolas,monospace}
body{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:6px 0 14px;font-weight:600}
input{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--dim);border-radius:6px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--dim);border-radius:6px;padding:10px 13px;margin:0 8px 8px 0}
.dim{color:var(--dim)}.bad{color:var(--bad)}.ac{color:var(--ac)}.cmd{color:var(--ac)}.g{font-size:18px;letter-spacing:.1em}
#out div{white-space:pre-wrap;word-break:break-word}
.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--dim);margin-bottom:10px}
.row{display:flex;gap:8px;margin-top:10px}.row input{margin:0;flex:1}.row button{margin:0}
#hud{position:sticky;bottom:0;background:var(--bg);padding:6px 0}
</style></head><body>
<div id="auth">
<h1>&gt; breach <span class="dim">private beta</span></h1>
<input id="em" type="email" placeholder="email" autocomplete="username" autocapitalize="none">
<input id="pw" type="password" placeholder="password (6+ characters)" autocomplete="current-password">
<input id="un" placeholder="username (new players only)" autocapitalize="none">
<input id="iv" placeholder="invite code (new players only)" autocapitalize="characters">
<button onclick="enter('in')">Sign in</button><button onclick="enter('up')">Create account</button>
<div id="aerr" class="bad"></div>
</div>
<div id="term" hidden>
<div class="bar"><span id="who"></span><button onclick="run('logout')">logout</button></div>
<div id="out"></div>
<div id="hud" class="ac"></div>
<div class="row"><input id="cmd" placeholder="type a command" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"><button onclick="send()">Go</button></div>
<div style="margin-top:10px">
<button onclick="run('status')">status</button><button onclick="run('shop')">shop</button><button onclick="run('inventory')">inventory</button><button onclick="run('notes')">notes</button><button onclick="run('help')">help</button>
</div>
</div>
<script>
const URL_='https://ksehevxvsijwrntgvbgw.supabase.co';
const KEY='sb_publishable_7R3Z77ufmFBUhjZVkUdISQ_wj2acsEs';
const $=id=>document.getElementById(id);
let S=null,P=null,A=null,tm=null;
try{S=JSON.parse(localStorage.getItem('sess')||'null')}catch(e){}
function save(s){S=s;try{localStorage.setItem('sess',JSON.stringify(s))}catch(e){}}
function msg(j){return j&&(j.message||j.msg||j.error_description||j.error)||'request failed'}
async function raw(path,o={}){
const h={apikey:KEY,'Content-Type':'application/json'};
if(o.auth&&S)h.Authorization='Bearer '+S.access_token;
const r=await fetch(URL_+path,{method:o.method||'POST',headers:h,body:o.body?JSON.stringify(o.body):undefined});
let j=null;try{j=await r.json()}catch(e){}
if(!r.ok)throw new Error(msg(j));return j}
function setSess(j){save({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000})}
async function fresh(){
if(S&&Date.now()>S.exp-60000){try{setSess(await raw('/auth/v1/token?grant_type=refresh_token',{body:{refresh_token:S.refresh_token}}))}catch(e){save(null);throw new Error('session expired, sign in again')}}}
async function rpc(fn,args){await fresh();return raw('/rest/v1/rpc/'+fn,{auth:true,body:args||{}})}
async function get(q){await fresh();return raw('/rest/v1/'+q,{auth:true,method:'GET'})}
async function enter(mode){
const em=$('em').value.trim(),pw=$('pw').value;$('aerr').textContent='';
try{let j;
if(mode==='up'){j=await raw('/auth/v1/signup',{body:{email:em,password:pw}});
if(!j.access_token)throw new Error('Account made, but email confirmation is still on. Ask the admin to turn it off.')}
else j=await raw('/auth/v1/token?grant_type=password',{body:{email:em,password:pw}});
setSess(j);await boot()}catch(e){$('aerr').textContent=e.message}}
async function boot(){
let r=await get('players?select=*');
if(!r.length){const u=$('un').value.trim(),v=$('iv').value.trim();
if(!u||!v)throw new Error('First time here: fill in a username and invite code, then press Create account (or Sign in).');
await rpc('create_player',{p_username:u,p_invite:v});r=await get('players?select=*')}
P=r[0];$('auth').hidden=true;$('term').hidden=false;hdr();
out('Welcome, '+P.username+'.');out('Your IP: '+P.ip+'  (share it so friends can hack you)','ac');out('Type help for commands.','dim')}
function hdr(){$('who').textContent=P.username+'   $'+Number(P.money).toLocaleString()}
async function me(){P=(await get('players?select=*'))[0];hdr()}
function out(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.className=c;$('out').appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function send(){const v=$('cmd').value;$('cmd').value='';run(v);$('cmd').focus()}
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
async function run(line){
line=line.trim();if(!line)return;out('> '+line,'cmd');
try{
if(A&&/^[\d\s]+$/.test(line))return await guess(line.replace(/\s/g,''));
const[c,...a]=line.split(/\s+/);
switch(c.toLowerCase()){
case'help':['status        your stats and IP','shop          items and prices','buy <item> [n] buy items','inventory     what you own','hack <ip>     start a hack','notes         clues and guesses so far','logout'].forEach(l=>out(l,'dim'));
if(A)out('During a hack, just type digits to guess.','ac');break;
case'status':await status();break;
case'shop':{const r=await get('item_catalog?select=*&order=price');r.forEach(i=>out(i.id+'  $'+Number(i.price).toLocaleString()+'  (max '+i.hold_cap+')'));break}
case'buy':{if(!a[0])throw new Error('usage: buy <item> [amount]');const r=await rpc('buy_item',{p_item:a[0],p_qty:parseInt(a[1]||'1')});await me();out('Bought. You now own '+r.qty+' x '+r.item_id,'ac');break}
case'inventory':{const r=await get('player_items?select=item_id,qty&qty=gt.0');if(!r.length)out('Nothing yet.','dim');r.forEach(i=>out(i.item_id+'  x'+i.qty));break}
case'hack':await hack(a[0]);break;
case'notes':if(!A){out('No hack in progress.','dim');break}A.clues.forEach(c=>out('CLUE: '+c,'ac'));A.hist.forEach(l=>out(l,'g'));break;
case'logout':save(null);location.reload();break;
default:out('Unknown command. Type help.','bad')}
}catch(e){out('ERROR: '+e.message,'bad')}}
async function status(){
await me();const now=Date.now();
const left=t=>t&&Date.parse(t)>now?Math.ceil((Date.parse(t)-now)/60000)+' min':'none';
['USER      '+P.username,'YOUR IP   '+P.ip,'MONEY     $'+Number(P.money).toLocaleString(),'CRACKER   L'+P.cracker_level,'FIREWALL  L'+P.firewall_level,'RANK PTS  '+P.rank_points,'HEAT      '+P.heat+'%','HITS      '+P.hit_count,'SHIELD    '+left(P.shield_until),'IMMUNE    '+left(P.immune_until)].forEach(l=>out(l))}
async function hack(ip){
if(!ip)throw new Error('usage: hack <ip>');
if(A)throw new Error('finish your current hack first');
const j=await rpc('start_attack',{p_target_ip:ip});
A={...j,exp:Date.parse(j.expires_at),left:j.max_guesses,hist:[]};
for(const l of['Resolving host '+ip+'...','Handshake OK','Bypassing layers...','Core exposed.']){out(l,'dim');await wait(250)}
out('TARGET  '+j.target+'  (firewall L'+j.firewall+')');
j.clues.forEach(c=>out('CLUE: '+c,'ac'));
out('Enter a '+j.code_len+'-digit key ('+j.min_digit+'-'+j.max_digit+(j.no_repeat?', no repeats':', repeats allowed')+')');
out('● right spot   ○ wrong spot   · not in code','dim');
hud();clearInterval(tm);tm=setInterval(hud,1000)}
function hud(){
if(!A){$('hud').textContent='';return}
const s=Math.max(0,Math.ceil((A.exp-Date.now())/1000));
$('hud').textContent='TIME '+s+'s    GUESSES LEFT '+A.left;
if(s===0&&!A.closing){A.closing=true;const a=A;setTimeout(()=>timeUp(a),3500)}}
async function timeUp(a){
if(A!==a)return;
try{handle(await rpc('submit_guess',{p_attack:a.attack_id,p_guess:'0'}),'')}catch(e){out('ERROR: '+e.message,'bad')}}
async function guess(v){handle(await rpc('submit_guess',{p_attack:A.attack_id,p_guess:v}),v)}
function handle(j,v){
const sym={e:'●',m:'○',x:'·'};
if(j.result){const l=(v?v.split('').join(' ')+'   ':'')+j.result.split('').map(c=>sym[c]).join(' ');A.hist.push(l);out(l,'g')}
if(j.status==='active'){A.left=j.guesses_left;hud();return}
clearInterval(tm);
if(j.status==='won'){out('ACCESS GRANTED','ac');out('Extracted $'+Number(j.stolen).toLocaleString()+' ('+j.percent+'% of their money)')}
else if(j.status==='blocked')out('Target became protected mid-hack. Nothing stolen.','bad');
else{out('TRACE COMPLETE','bad');out((j.reason==='time'?'Out of time. ':'Out of guesses. ')+'The code was '+j.secret)}
A=null;hud();me().catch(()=>{})}
if(S){boot().catch(()=>{})}
</script></body></html>
